name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Стиль кода (Prettier)
        run: npm run format:check
      - name: Линтер (ESLint)
        run: npm run lint
      - name: Тесты (Vitest)
        run: npm test
      - name: Сборка и пререндер
        run: npm run build
